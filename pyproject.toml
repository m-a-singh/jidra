[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jidra"
version = "0.1.1"
description = "JIDRA (Java Intelligent Diagnostic & Reasoning Agent) minimal CLI baseline"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "tree-sitter>=0.22.0",
  "tree-sitter-java>=0.21.0",
  "tree-sitter-go>=0.21.0",
  "tree-sitter-c-sharp>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "libcst>=0.4.10",
  "pyright>=1.1.330",
  "litellm>=1.82.0",
  "pyyaml>=6.0.0",
  "mcp>=1.27.0",
  "watchdog>=4.0.0",
  "protobuf>=4.25.0",
  "rich>=13.0.0",
  "snowballstemmer>=2.2.0",
  "fastapi>=0.111.0", "uvicorn[standard]>=0.29.0"
]

[project.scripts]
jidra = "jidra.cli:main"

[project.optional-dependencies]
mcp = ["mcp"]
test = ["pytest>=8.0.0", "ruff>=0.13.0", "numpy>=1.24.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "BLE001",   # broad except Exception — intentional in CLI/eval error handlers
  "S110",     # try-except-pass — intentional silencing of non-critical paths
  "S112",     # try-except-continue — intentional
  "EXE001",   # shebang-not-executable — scripts run via python, not chmod
  "DTZ005",   # datetime.now without tz — local time fine for this tool
  "DTZ006",   # datetime.fromtimestamp without tz
  "DTZ011",   # date.today without tz
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jidra", "jidra.*"]

[tool.setuptools.package-data]
jidra = ["claude_install/agents/*.md", "claude_install/skills/*/SKILL.md"]

[package]
name = "jidra-resolver"
version = "0.1.0"
edition = "2021"

[lib]
name = "jidra_resolver"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
regex = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

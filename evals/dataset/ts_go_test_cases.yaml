- id: caddyserver__caddy-4774
  repo: caddyserver/caddy
  commit: f7be0ee10131f25620a2f64af7e3ded43eae2049
  query: "default_bind global option cannot accept multiple IP addresses\nI'm running\
    \ Caddy 2.5.1 in a dual-stack server.\r\nI'd like to make Caddy bind by default\
    \ to the IPv4 address and one main IPv6 address, and then customize certain sites\
    \ to bind on other IPv6 addresses.\r\n\r\n```text\r\n{\r\n  default_bind [2001:db8:11:ad::80]\
    \ 198.51.100.184\r\n}\r\n:33441 {\r\n  respond \"site 33441\"\r\n}\r\n:33442 {\r\
    \n  bind [2001:db8:11:ad::2]\r\n  respond \"site 33442\"\r\n}\r\n```\r\n\r\nThe\
    \ **bind** directive accepts multiple IP addresses.\r\nHowever, the **default\\\
    _bind** global option does not seem to accept multiple IP addresses.\r\n\r\nIf\
    \ I put two IP addresses in **default\\_bind** global option like the example\
    \ above, Caddy fails to start with error:\r\n\r\n```shell\r\n$ caddy run -config\
    \ Caddyfile\r\n2022/05/08 18:47:58.911\tINFO\tusing provided configuration\t{\"\
    config_file\": \"Caddyfile\", \"config_adapter\": \"\"}\r\nrun: adapting config\
    \ using caddyfile: parsing caddyfile tokens for 'default_bind': Caddyfile:2 -\
    \ Error during parsing: Wrong argument count or unexpected line ending after '198.51.100.184'\r\
    \n```\r\n\r\nIf I write two **default\\_bind** global options each with one IP\
    \ address, Caddy starts but it only binds to the IP address specified in the last\
    \ **default\\_bind** global option, as confirmed by the output of `ss -an | grep\
    \ LISTEN` command.\r\n\r\n```\r\n{\r\n  default_bind [2001:db8:11:ad::80]\r\n\
    \  default_bind 198.51.100.184\r\n}\r\n```\r\n\r\nWhile I could write **bind**\
    \ directive into each site, it is less convenient.\r\nThus, I hope **default\\\
    _bind** global option could support multiple IP addresses.\n"
  expected:
  - caddyconfig/httpcaddyfile/addresses.go
  - caddyconfig/httpcaddyfile/options.go

# Offline eval test cases
# tool: search | explore | find_callers | get_flow | negative
# expected: list of method name substrings that must appear in results
# pass_threshold: min recall to pass (default 0.5)
# rank_threshold: max rank for MRR target (search only, default 10)

cases:

  # ── shapeshift ──────────────────────────────────────────────────────────────
  - id: shapeshift-search-getTradeQuote
    repo: shapeshift
    tool: search
    query: getTradeQuote
    expected: [getTradeQuote]

  - id: shapeshift-search-getRates
    repo: shapeshift
    tool: search
    query: getRates
    expected: [getRates]

  - id: shapeshift-search-getAssets
    repo: shapeshift
    tool: search
    query: getAssets
    expected: [getAssets]

  - id: shapeshift-search-broadcastTransaction
    repo: shapeshift
    tool: search
    query: broadcastTransaction
    expected: [broadcastTransaction]

  - id: shapeshift-search-estimateFees
    repo: shapeshift
    tool: search
    query: estimateFees
    expected: [estimateFees]

  - id: shapeshift-search-signTransaction
    repo: shapeshift
    tool: search
    query: signTransaction
    expected: [signTransaction]

  - id: shapeshift-explore-swap
    repo: shapeshift
    tool: explore
    query: How does the swap flow work?
    expected: [getTradeQuote, broadcastTransaction]

  - id: shapeshift-explore-signing
    repo: shapeshift
    tool: explore
    query: How are transactions signed and broadcast?
    expected: [signTransaction, broadcastTransaction]

  - id: shapeshift-explore-rates
    repo: shapeshift
    tool: explore
    query: How does the app get current exchange rates?
    expected: [getRates, getAssets]

  - id: shapeshift-explore-fees
    repo: shapeshift
    tool: explore
    query: How are transaction fees estimated?
    expected: [estimateFees]

  - id: shapeshift-explore-broadcast
    repo: shapeshift
    tool: explore
    query: How are signed transactions broadcast to the network?
    expected: [broadcastTransaction, signTransaction]

  - id: shapeshift-explore-assets
    repo: shapeshift
    tool: explore
    query: How does the app fetch and display assets?
    expected: [getAssets, getRates]

